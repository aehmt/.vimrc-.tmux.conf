# =============================================================================
# General Settings
# =============================================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g @shell_mode 'vi'
set-window-option -g mode-keys vi
set -g history-limit 10000
set -g display-time 4000
set -s escape-time 0
set-option -g focus-events on
set-option -g default-command "/bin/zsh -l"

# =============================================================================
# Terminal & Colors
# =============================================================================
set-option -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm*:smcup@:rmcup@'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# =============================================================================
# Key Bindings
# =============================================================================

# Copy mode
bind-key C-j copy-mode
bind-key j copy-mode
bind-key b set-window-option synchronize-panes

# Pane splitting (preserves current path)
bind-key V split-window -vc '#{pane_current_path}'
bind-key v split-window -hc '#{pane_current_path}'

# Windows
bind-key c new-window
bind-key C new-window -c "#{pane_current_path}"
bind-key -r n next-window
bind-key -r p previous-window

# Pane resizing
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 10
bind-key -r L resize-pane -R 10

# Vim-aware pane navigation (C-h/j/k/l works transparently in both vim and tmux)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# =============================================================================
# Plugins (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
